version: "2"
linters:
  default: none
  disable:
    - gosec
    - mnd
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - dupword
    - errcheck
    - errorlint
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    # - gosec
    - govet
    - ineffassign
    - misspell
    # - mnd
    - nakedret
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - whitespace
  settings:
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      confidence: 1
    goconst:
      match-constant: true
      min-len: 4
      min-occurrences: 5
      ignore-calls: true
      numbers: false
      min: 3
      max: 3
      find-duplicates: false
      eval-const-expressions: false
      ignore-tests: false
  exclusions:
    generated: lax
    presets:
      - std-error-handling
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fmotalleb/junction